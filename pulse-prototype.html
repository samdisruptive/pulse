<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse by Disruptive · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface-sunken:#f3f5f8;--surface-hover:#f3f5f8;--border:#e4e7ec;--border-strong:#cdd3db;--border-control:#8c95a2;
  --ink:#000d1a;--ink-muted:#5b6472;--ink-subtle:#7a8494;
  --accent:#c4006a;--accent-hover:#9e0056;--accent-fill:#fe0089;--accent-fill-hover:#e6007c;--accent-tint:#ffe6f3;--on-accent:#000d1a;--accent-ink:#c4006a;--focus-ring:#fe0089;
  --good:#0b7a53;--bad:#b54708;--critical:#c0241b;--on-critical:#ffffff;--critical-tint:#fce8e6;--critical-ink:#8f1c13;
  --warning-tint:#fdeee3;--warning-ink:#9a3f05;--healthy-tint:#e2f5ec;--healthy-ink:#0b6a48;--neutral-tint:#ebeef2;--good-tint:#e2f5ec;--bad-tint:#fdeee3;
  --info:#2f5bea;--info-tint:#e8eefd;--li:#0b6375;--li-tint:#dff1f4;
  --chart-1:#2f5bea;--chart-2:#e07b24;--chart-3:#13896f;--chart-4:#8a5cd0;--chart-5:#b8901a;--chart-6:#6b7380;
  --chart-current:#000d1a;--chart-comparison:#9aa3af;--chart-grid:#e9ecf0;--chart-incomplete:#eef1f4;
  --brand-navy:#000d1a;--brand-pink:#fe0089;--tile:#000d1a;
  --shadow-xs:0 1px 2px rgba(0,13,26,.08);--shadow-pop:0 1px 2px rgba(0,13,26,.06),0 16px 40px rgba(0,13,26,.16);
  --scrim:rgba(0,13,26,.32);
  --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;
  --control-sm:30px;--control-md:36px;--control-lg:44px;--row:42px;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000d1a;--surface:#0d1e33;--surface-sunken:#15293f;--surface-hover:#13263c;--border:#1e3049;--border-strong:#33486a;--border-control:#5f7391;
    --ink:#f3f5f8;--ink-muted:#a3aebe;--ink-subtle:#7d8aa0;
    --accent:#ff4fae;--accent-hover:#ff7ac2;--accent-fill:#fe0089;--accent-fill-hover:#ff2e9a;--accent-tint:#3a0a24;--on-accent:#000d1a;--accent-ink:#ff4fae;--focus-ring:#ff4fae;
    --good:#48c79a;--bad:#ffa266;--critical:#ff7b70;--on-critical:#1c0503;--critical-tint:#3a1512;--critical-ink:#ffb4ac;
    --warning-tint:#3a2010;--warning-ink:#ffb98a;--healthy-tint:#0e2e25;--healthy-ink:#7fdcbe;--neutral-tint:#1b2f48;--good-tint:#0e2e25;--bad-tint:#3a2010;
    --info:#8fa8ff;--info-tint:#1a2650;--li:#6fd0e0;--li-tint:#0e2c33;
    --chart-1:#8fa8ff;--chart-2:#f59a4a;--chart-3:#3fb896;--chart-4:#b596f0;--chart-5:#e0bc4a;--chart-6:#8592a6;
    --chart-current:#e8ecf2;--chart-comparison:#5b6f8c;--chart-grid:#1b2f48;--chart-incomplete:#13263c;--tile:#1e3049;
    --shadow-xs:0 1px 2px rgba(0,0,0,.6);--shadow-pop:0 1px 2px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#000d1a;--surface:#0d1e33;--surface-sunken:#15293f;--surface-hover:#13263c;--border:#1e3049;--border-strong:#33486a;--border-control:#5f7391;
    --ink:#f3f5f8;--ink-muted:#a3aebe;--ink-subtle:#7d8aa0;
    --accent:#ff4fae;--accent-hover:#ff7ac2;--accent-fill:#fe0089;--accent-fill-hover:#ff2e9a;--accent-tint:#3a0a24;--on-accent:#000d1a;--accent-ink:#ff4fae;--focus-ring:#ff4fae;
    --good:#48c79a;--bad:#ffa266;--critical:#ff7b70;--on-critical:#1c0503;--critical-tint:#3a1512;--critical-ink:#ffb4ac;
    --warning-tint:#3a2010;--warning-ink:#ffb98a;--healthy-tint:#0e2e25;--healthy-ink:#7fdcbe;--neutral-tint:#1b2f48;--good-tint:#0e2e25;--bad-tint:#3a2010;
    --info:#8fa8ff;--info-tint:#1a2650;--li:#6fd0e0;--li-tint:#0e2c33;
    --chart-1:#8fa8ff;--chart-2:#f59a4a;--chart-3:#3fb896;--chart-4:#b596f0;--chart-5:#e0bc4a;--chart-6:#8592a6;
    --chart-current:#e8ecf2;--chart-comparison:#5b6f8c;--chart-grid:#1b2f48;--chart-incomplete:#13263c;--tile:#1e3049;
    --shadow-xs:0 1px 2px rgba(0,0,0,.6);--shadow-pop:0 1px 2px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.55);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/20px var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none;font-weight:500}
a:hover{color:var(--accent-hover);text-decoration:underline}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.sm{font-size:13px;line-height:18px}.xs{font-size:12px;line-height:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* shell */
#app{height:100%}
.shell{display:flex;height:100%;min-height:0}
.side{width:240px;flex:none;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:16px;padding:20px 14px;overflow-y:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.scroller{flex:1;overflow-y:auto;min-height:0}
.page{max-width:1320px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.topbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--border);z-index:20}
.crumbs{margin-right:auto;font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.crumbs a{color:var(--ink-muted)}
.crumbs strong{color:var(--ink);font-weight:600}
.btn.menu-btn{display:none}
.scope{display:flex;align-items:center;gap:10px;width:100%;height:52px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);text-align:left;cursor:pointer;font-weight:600}
.scope:hover{background:var(--surface-hover)}
.avatar{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent-tint);color:var(--accent);font:700 11px/1 var(--font-sans)}
.mark{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:10px;background:var(--tile)}
.mark img{width:21px;height:21px;display:block;object-fit:contain}
.lockup{display:flex;align-items:center;gap:12px;padding:0 6px}
.lockup-name{font:700 17px/18px var(--font-sans);letter-spacing:-0.01em}
.lockup-sub{font-size:12px;line-height:16px;color:var(--ink-muted)}
.kbd{margin-left:auto;padding:3px 5px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--ink-muted);font:500 11px/1 var(--font-mono)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px;border-radius:var(--radius-md);color:var(--ink-muted);font-size:14px;font-weight:500;text-decoration:none}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-tint);color:var(--ink);font-weight:600}
.nav a[aria-current="page"] .ico{color:var(--accent)}
.nav a.off{color:var(--ink-subtle)}
.nav .end{margin-left:auto}
.navgroup{padding:12px 10px 4px;color:var(--ink-muted);font:500 11px/16px var(--font-sans)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 4px 0;border-top:1px solid var(--border)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-md);padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);font:600 13px/1 var(--font-sans);white-space:nowrap;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-muted);text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-fill-hover);border-color:var(--accent-fill-hover);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-hover)}
.btn.small{height:var(--control-sm);padding:0 10px;font-size:12px}
.btn.icon{width:var(--control-md);padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.picker{display:inline-flex;align-items:center;gap:8px;height:var(--control-md);padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font:600 13px/1 var(--font-sans);color:var(--ink);white-space:nowrap;cursor:pointer}
select.picker{border-color:var(--border-control)}
.picker:hover{border-color:var(--ink-muted)}
.picker .muted{font-weight:400}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius-md);background:var(--surface-sunken);flex-wrap:wrap;border:1px solid var(--border)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-muted);font:600 12px/1 var(--font-sans);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-xs)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{display:inline-flex;align-items:center;gap:6px;height:42px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-muted);font:600 13px/1 var(--font-sans);text-decoration:none;cursor:pointer;white-space:nowrap;padding:0}
.tabs [aria-current="page"],.tabs [aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;height:var(--control-md);padding:0 12px;border:1px solid var(--border-control);border-radius:var(--radius-md);background:var(--surface);flex:1 1 260px;max-width:420px}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent-fill)}
@media (pointer:coarse){.btn,.picker,.search{height:var(--control-lg)}.seg button{height:40px}.nav a{min-height:44px}}

/* badges, tiers, deltas, freshness */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--neutral-tint);color:var(--ink);font:600 12px/1 var(--font-sans);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.count::before{display:none}
.badge.critical{background:var(--critical);color:var(--on-critical)}
.badge.warning{background:var(--warning-tint);color:var(--warning-ink)}
.badge.healthy{background:var(--healthy-tint);color:var(--healthy-ink)}
.badge.info{background:var(--info-tint);color:var(--info)}
.tier{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--border-strong);border-radius:6px;color:var(--ink-muted);font:600 11px/1 var(--font-sans);white-space:nowrap}
.tier.actual,.tier.google{border-color:var(--ink);color:var(--ink)}
.tier.platform,.tier.crawler{border-style:dashed}
.tier.derived{border-style:dotted}
.delta{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:600 12px/1 var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.better{background:var(--good-tint);color:var(--good)}.delta.worse{background:var(--bad-tint);color:var(--bad)}.delta.neutral{background:var(--neutral-tint);color:var(--ink-muted)}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);white-space:nowrap}
.dot{width:8px;height:8px;flex:none;border-radius:50%}
.dot.ok{background:var(--good)}.dot.delayed{border:2px solid var(--bad)}.dot.failing{background:var(--critical)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:52px}
.card-title{font:700 15px/22px var(--font-sans);display:inline-flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kpi{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);padding:12px}
a.kpi:hover{text-decoration:none;color:var(--ink);border-color:var(--border-control)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 0}
.kpi-title{display:flex;align-items:center;gap:8px;font:600 14px/20px var(--font-sans);color:var(--ink)}
.kpi-title .ico{color:var(--ink-muted)}
.kpi-well{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px;border-radius:12px;background:var(--surface-sunken)}
.kpi-well-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi-label{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.kpi-value{font:700 26px/30px var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-md{font:700 20px/26px var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-compare{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-muted)}
.kpi-meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px;font-size:12px;line-height:16px;color:var(--ink-muted)}
.info-btn{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--border-strong);background:none;color:var(--ink-muted);font:700 11px/1 var(--font-sans);cursor:pointer}
.info-btn[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kpi-def{padding:10px 12px;border-radius:10px;border:1px dashed var(--border-strong);font-size:12px;line-height:17px;color:var(--ink)}
.kpi-def dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:6px 0 0}
.kpi-def dt{color:var(--ink-muted)}.kpi-def dd{margin:0}
.kpi.stale .kpi-value{color:var(--ink-muted)}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.page-title{font:700 26px/32px var(--font-sans);letter-spacing:-.02em}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini>div{background:var(--surface-sunken);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mini-label{font-size:12px;color:var(--ink-muted)}
.skel{display:block;background:var(--surface-sunken);border-radius:var(--radius-sm);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* tables */
.scroll-x{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
.t th{height:40px;padding:0 14px;text-align:left;font-weight:600;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.t th button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
.t th[aria-sort]{color:var(--ink)}
.t td{height:var(--row);padding:0 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.t tbody tr:hover td{background:var(--surface-hover)}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t tr.child td{background:var(--surface-sunken);color:var(--ink-muted)}
.t tr.child td:first-child{padding-left:46px}
.t tr.total td{font-weight:600;border-top:1px solid var(--border-control)}
.t tr.clickable{cursor:pointer}
.t .wrap{white-space:normal}
.t .first{position:sticky;left:0;background:inherit}
.exp{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--surface);font:500 12px/1 var(--font-mono);cursor:pointer;vertical-align:middle}
.cell-link{color:var(--ink);font-weight:600}
.cell-link:hover{color:var(--accent)}
.url-link{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.url-link:hover{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;white-space:nowrap;background:var(--surface)}
.chip.off{border-style:dashed;color:var(--ink-subtle)}

/* lists */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-title{font-weight:500}
.item-meta{font-size:12px;line-height:16px;color:var(--ink-muted)}
.item.clickable{cursor:pointer}
.item.clickable:hover{background:var(--surface-hover)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--radius-md);background:var(--surface-sunken);font-size:13px;line-height:18px}
.banner.warning{background:var(--warning-tint);color:var(--warning-ink)}
.banner.critical{background:var(--critical-tint);color:var(--critical-ink)}
.banner.info{background:var(--info-tint);color:var(--ink)}
.banner a{color:inherit;text-decoration:underline;font-weight:500}
.banner .act{margin-left:auto}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:24px;border:1px dashed var(--border-control);border-radius:var(--radius-lg);background:var(--surface)}
.empty p{max-width:56ch;color:var(--ink-muted);font-size:13px;line-height:18px}
.bars{display:grid;grid-template-columns:minmax(90px,140px) 1fr 56px;gap:6px 12px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:2px;background:var(--ink-muted)}
.track{background:var(--surface-sunken);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.axis{display:flex;justify-content:space-between;font:500 11px/16px var(--font-sans);font-variant-numeric:tabular-nums;color:var(--ink-muted)}
svg.chart{display:block;width:100%;overflow:visible}
.c-grid{stroke:var(--chart-grid)}
.c-cur{fill:none;stroke:var(--chart-current);stroke-width:2;vector-effect:non-scaling-stroke}

.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.dl dt{color:var(--ink-muted)}.dl dd{margin:0}
.steps{display:flex;flex-direction:column}

<div id="app"></div>

  const up = uptimeRows(c); const avgUp = up.reduce((a, r) => a + r.uptime, 0) / up.length; const avgRt = up.reduce((a, r) => a + r.p50, 0) / up.length;
  secCards.push('<div class="card stack"><div class="row between"><h2 class="card-title">' + ico('uptime') + 'Uptime and infrastructure</h2><span class="xs muted">' + c.sites.length + (c.sites.length > 1 ? ' sites' : ' site') + '</span></div><div class="mini"><div><div class="mini-label">Uptime, 30 days</div><div class="kpi-md">' + nf2.format(avgUp) + '%</div></div><div><div class="mini-label">Median response</div><div class="kpi-md">' + nf0.format(avgRt) + ' ms</div></div></div>' + (siteDown(c) ? '<p class="sm" style="color:var(--critical);font-weight:500">' + esc(siteDown(c)) + ' is down now</p>' : '<p class="xs muted">' + (INCIDENTS.find((x) => x.client === c.id) ? '1 incident in 30 days' : 'No incidents in 30 days') + '</p>') + '<a href="' + cHref(c, 'uptime') + '" class="sm">Open Uptime</a></div>');
  const nc = notConnected(c).filter((n) => n.id === 'gmc' || n.id === 'paid');

  return scopeBanner(c) +
    '<div class="page-head"><div><h1 class="page-title">' + esc(c.name) + '</h1><p class="muted sm">' + c.type + ' · Owner ' + esc(PEOPLE[c.owner]) + ' · KPI profile: ' + c.kpis.map((k) => metricLabel(c, k)).join(', ') + '</p></div><div class="row">' + aiBtn('kpis', 'Summarise with AI') + '<a class="btn pri" href="' + cHref(c, 'reports') + '">Generate report</a></div></div>' +
    needsAttention(c, oi) +
    '<section class="grid g-kpi" aria-label="Key metrics">' + c.kpis.map((k) => kpiCard(c, k, { stale: (MET[k].src === 'ga4' && svcStatus(c, 'ga4') !== 'ok'), href: cHref(c, { store: 'ecommerce', ga4: 'analytics', gsc: 'organic', ads: 'paid', derived: hasAds(c) ? 'paid' : 'analytics' }[MET[k].src]), meta: (MET[k].src === 'ga4' && svcStatus(c, 'ga4') === 'failing') ? fresh('failing', 'GA4 not synced since 17 Oct') : (c.tracking && k === 'leads' && issueState(ISSUES[1]) !== 'resolved' ? fresh('delayed', 'Tracking suspected, see issue') : null) })).join('') + '</section>' + insightsSummaryCard(c) +
    chartCard(c, c.kpis.filter((k) => !(MET[k].src === 'ga4' && svcStatus(c, 'ga4') === 'failing')).concat(c.m.sessions && c.kpis.indexOf('sessions') < 0 && svcStatus(c, 'ga4') === 'ok' ? ['sessions'] : [])) +
    '<section class="grid g-3" style="align-items:start">' + secCards.join('') + '</section>' +
    (nc.length ? '<section class="grid g-2">' + nc.map((n) => n.id === 'gmc' ? emptyState('Merchant Center is not connected', 'Connect it to see product feed health, disapprovals and Shopping visibility for ' + c.name + '. You need access to the client\'s Merchant Center account.', '<button class="btn pri" ' + act('toast', 'Merchant Center arrives in phase 2.') + '>Connect Merchant Center</button><button class="btn ghost" ' + act('toast', 'Hidden for this client. Undo in Client settings.') + '>Hide this</button>') : emptyState('No ad platforms connected', c.name + ' has no Google Ads or Meta Ads account linked. Connect one to see spend, conversions and blended efficiency here.', '<button class="btn" ' + act('toast', 'Opens Integrations with this client preselected.') + '>Connect an ad account</button>')).join('') + '</section>' : '') +
    '<section class="grid g-2" style="align-items:start"><div class="card flush">' + cardHead('What changed', '<span class="xs muted">signals this period</span>') + (signalsFor([c], 5, 4).map((s) => signalItem(s, false)).join('') || '<div class="item muted sm">Nothing moved beyond its normal range.</div>') + '</div>' +
    '<div class="card flush">' + cardHead('Data sources', link(cHref(c, 'settings'), 'Manage mapping')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Source</th><th>Mapped</th><th>Last sync</th><th>Status</th></tr></thead><tbody>' + srcs + '</tbody></table></div></div></section>';

/* ---------- analytics ---------- */
function pageAnalytics(c, tab) {
  tab = tab || 'acquisition';
  const tabs = [['traffic', 'Traffic'], ['acquisition', 'Acquisition'], ['pages', 'Landing pages'], ['conversions', 'Conversions'], ['audience', 'Audience'], ['engagement', 'Engagement']];
  let body = '';
  const failing = svcStatus(c, 'ga4') === 'failing';
  if (tab === 'acquisition' || tab === 'traffic') {
    const rows = channelRows(c);
    const top = rows.slice(0, 4);
    const colors = ['--chart-1', '--chart-2', '--chart-3', '--chart-4'];
    const sess = series(c, 'sessions', 'cur'); const tot = sess.reduce((a, b) => a + b, 0);
    if (tab === 'traffic') {
      const keys = ['sessions', 'engRate'];
      body += '<section class="grid g-kpi">' + keys.map((k) => kpiCard(c, k, { stale: failing })).join('') + kpiCard(c, c.type === 'Ecommerce' ? 'orders' : 'leads', { stale: failing }) + (c.m.gaRevenue ? kpiCard(c, 'gaRevenue', { stale: failing }) : '') + '</section>' + chartCard(c, ['sessions', 'engRate'], { ns: 'traffic' });
    } else {
      body += '<section class="card stack"><div class="row between"><h2 class="card-title">Sessions by channel</h2>' + legend(top.map((r, i) => ({ name: r.name, color: colors[i] }))) + '</div>' +
        multiChart({ days: dayList(), series: top.map((r, i) => ({ name: r.name, color: colors[i], vals: sess.map((v) => v / tot * r.sessions * (1 + (rnd(r.name + v) - 0.5) * 0.12)) })), fmt: (v) => nf0.format(v), inc: incompleteDays('ga4'), label: 'Sessions by channel per day' }) + '</section>';
      const tsum = rows.reduce((a, r) => ({ s: a.s + r.sessions, p: a.p + r.prev, k: a.k + r.ke, rv: a.rv + (r.rev || 0), rp: a.rp + (r.revPrev || 0) }), { s: 0, p: 0, k: 0, rv: 0, rp: 0 });
      const ecom = c.m.gaRevenue;
      const tr = (r, kid) => '<tr class="' + (kid ? 'child' : '') + '"><td>' + (kid ? '' : (r.kids.length > 1 ? '<button class="exp" ' + act('expand', r.name) + ' aria-expanded="' + !!S.expanded[r.name] + '" aria-label="' + (S.expanded[r.name] ? 'Collapse ' : 'Expand ') + esc(r.name) + '">' + (S.expanded[r.name] ? '−' : '+') + '</button>' : '<span style="display:inline-block;width:30px"></span>')) + esc(r.name) + '</td><td class="n">' + nf0.format(r.sessions) + '</td><td class="n">' + pctDelta(r.sessions, r.prev, 'up') + '</td><td class="n">' + nf1.format(r.eng) + '%</td><td class="n">' + nf0.format(r.ke) + '</td><td class="n">' + nf2.format(r.ke / r.sessions * 100) + '%</td>' + (ecom ? '<td class="n">' + money(r.rev) + '</td><td class="n">' + pctDelta(r.rev, r.revPrev, 'up') + '</td>' : '') + '</tr>';
      body += '<section class="card flush">' + cardHead('Channels', '<span class="xs muted">Expand a channel for source / medium.</span>' + aiBtn('channels')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Channel</th><th class="n" aria-sort="descending">Sessions ▾</th><th class="n">Change</th><th class="n">Engagement</th><th class="n">' + (c.type === 'Ecommerce' ? 'Purchases' : esc(c.leadLabel || 'Key events')) + '</th><th class="n">Rate</th>' + (ecom ? '<th class="n">Revenue ' + tier('measured') + '</th><th class="n">Change</th>' : '') + '</tr></thead><tbody>' +
        rows.map((r) => tr(r) + (S.expanded[r.name] && r.kids.length > 1 ? r.kids.map((k) => tr(k, true)).join('') : '')).join('') +
        '<tr class="total"><td>Total</td><td class="n">' + nf0.format(tsum.s) + '</td><td class="n">' + pctDelta(tsum.s, tsum.p, 'up') + '</td><td class="n">' + fmtVal('engRate', metricVal(c, 'engRate').cur) + '</td><td class="n">' + nf0.format(tsum.k) + '</td><td class="n">' + nf2.format(tsum.k / tsum.s * 100) + '%</td>' + (ecom ? '<td class="n">' + money(tsum.rv) + '</td><td class="n">' + pctDelta(tsum.rv, tsum.rp, 'up') + '</td>' : '') + '</tr></tbody></table></div>' +
        (ecom && c.m.revenue ? '<p class="xs muted" style="padding:12px 16px">GA4 revenue is measured on site and runs ' + nf1.format(Math.abs((metricVal(c, 'gaRevenue').cur / metricVal(c, 'revenue').cur - 1) * 100)) + '% below ' + SVC[c.store].name + ' revenue (Actual) this period. Use Ecommerce for sales figures.</p>' : '') + '</section>';
    }
  } else if (tab === 'pages') {
    const rows = pageRows(c);
    body += '<section class="card flush">' + cardHead('Landing pages', '<span class="xs muted">Click a page for GA4, Search Console, index status and Core Web Vitals in one place</span>') + '<div class="scroll-x"><table class="t"><thead><tr><th>Page</th><th class="n">Sessions ▾</th><th class="n">Change</th><th class="n">Engagement</th><th class="n">Key events</th></tr></thead><tbody>' + rows.map((r) => '<tr><td>' + urlLink(c, c.sites[0].d, r.path) + '</td><td class="n">' + nf0.format(r.sessions) + '</td><td class="n">' + pctDelta(r.sessions, r.prev, 'up') + '</td><td class="n">' + nf1.format(r.eng) + '%</td><td class="n">' + nf0.format(r.ke) + '</td></tr>').join('') + '</tbody></table></div></section>';
  } else if (tab === 'audience') {
    const geo = c.sites.length > 1 && currencies(c).length > 1 ? [['United Kingdom', 0.71], ['Ireland', 0.09], ['Germany', 0.1], ['United States', 0.04], ['Other', 0.06]] : [['United Kingdom', 0.93], ['Ireland', 0.02], ['United States', 0.02], ['Other', 0.03]];
    const dev = [['Mobile', 0.68], ['Desktop', 0.27], ['Tablet', 0.05]];
    const blk = (title, rows) => '<div class="card stack"><h2 class="card-title">' + title + '</h2><div class="bars">' + rows.map((r) => '<span>' + r[0] + '</span><div class="track"><div class="bar" style="width:' + (r[1] / rows[0][1] * 100).toFixed(0) + '%"></div></div><span class="num" style="text-align:right">' + nf0.format(r[1] * 100) + '%</span>').join('') + '</div></div>';
    body += '<section class="grid g-2" style="align-items:start">' + blk('Countries', geo) + blk('Devices', dev) + '</section><p class="xs muted">Shares of sessions. Demographics are off for this property, so age and gender are not shown.</p>';
  } else {
    const rows = pageRows(c);
    body += '<section class="card flush">' + cardHead(tab === 'conversions' ? 'Key events by page' : 'Engagement by page') + '<div class="scroll-x"><table class="t"><thead><tr><th>Page</th><th class="n">' + (tab === 'conversions' ? 'Key events' : 'Engagement rate') + '</th><th class="n">' + (tab === 'conversions' ? 'Rate' : 'Avg engagement time') + '</th></tr></thead><tbody>' + rows.map((r) => '<tr><td>' + urlLink(c, c.sites[0].d, r.path) + '</td><td class="n">' + (tab === 'conversions' ? nf0.format(r.ke) : nf1.format(r.eng) + '%') + '</td><td class="n">' + (tab === 'conversions' ? nf2.format(r.ke / r.sessions * 100) + '%' : Math.round(30 + r.eng) + 's') + '</td></tr>').join('') + '</tbody></table></div></section>';
  }
  return clientBanners(c, 'analytics') + '<div class="page-head"><h1 class="page-title">Analytics</h1>' + tier('measured') + '</div><nav class="tabs" aria-label="Analytics views">' + tabs.map((t) => '<a href="' + cHref(c, 'analytics', t[0]) + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + '</a>').join('') + '</nav>' + body;
}

/* ---------- organic ---------- */
function pageOrganic(c, tab) {
  tab = tab || 'performance';
  const tabs = [['performance', 'Performance'], ['queries', 'Queries'], ['pages', 'Pages'], ['countries', 'Countries and devices']];
  let body = '<div class="banner">Both periods end on 17 Oct so the comparison is like for like. Search Console holds the last 2 days back while it processes them.</div>';
  const qs = queryRows(c).filter((q) => S.brandFilter === 'all' || (S.brandFilter === 'brand' ? q.brand : !q.brand));
  const qTable = (rows) => '<div class="scroll-x"><table class="t"><thead><tr><th>Query</th><th class="n" aria-sort="descending">Clicks ▾</th><th class="n">Change</th><th class="n">Impressions</th><th class="n">CTR</th><th class="n">Position</th><th>Top page</th></tr></thead><tbody>' + (rows.length ? rows.map((q) => '<tr><td>' + esc(q.q) + (q.brand ? ' <span class="xs muted">brand</span>' : '') + '</td><td class="n">' + nf0.format(q.clicks) + '</td><td class="n">' + pctDelta(q.clicks, q.prev, 'up') + '</td><td class="n">' + nf0.format(q.imp) + '</td><td class="n">' + nf2.format(q.ctr) + '%</td><td class="n"><span class="delta ' + judge('down', q.pos - q.prevPos, true) + '">' + nf1.format(q.prevPos) + ' → ' + nf1.format(q.pos) + '</span></td><td>' + urlLink(c, c.sites[0].d, q.page) + '</td></tr>').join('') : '<tr><td colspan="7" class="muted">No queries match this filter. <button class="btn small" ' + act('brandFilter', 'all') + '>Show all</button></td></tr>') + '</tbody></table></div>';
  const brandSeg = seg('brandFilter', [['all', 'All'], ['non', 'Non-brand'], ['brand', 'Brand']], S.brandFilter, 'Brand filter');
  if (tab === 'performance') {
    const keys = ['clicks', 'impressions', 'ctr', 'position'];
    const sel = S.organicMetric;
    body += '<section class="grid g-kpi">' + keys.map((k) => { const mv = metricVal(c, k); if (S.loading) return skelKpi(); return '<button class="card kpi" style="text-align:left;cursor:pointer;' + (k === sel ? 'border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)' : '') + '" ' + act('organicMetric', k) + ' aria-pressed="' + (k === sel) + '"><span class="kpi-label">' + mv.def.label + '</span><span class="kpi-value num">' + fmtVal(k, mv.cur, null, { compact: k === 'impressions' }) + '</span><span class="kpi-compare">' + deltaHtml(mv) + '</span></button>'; }).join('') + '</section>';
    const mv = metricVal(c, sel);
    body += '<section class="card stack"><div class="row between"><h2 class="card-title">Daily ' + mv.def.label.toLowerCase() + '</h2>' + compareLegend() + '</div>' + lineChart({ cur: series(c, sel, 'cur'), cmp: series(c, sel, 'prev'), days: dayList(), fmt: (v) => fmtVal(sel, v), inc: incompleteDays('gsc'), invert: sel === 'position', label: 'Daily ' + mv.def.label }) + (sel === 'position' ? '<p class="xs muted">Axis inverted: higher on the chart is better.</p>' : '') + '</section>';
    const ranked = queryRows(c).filter((q) => !q.brand).map((q) => Object.assign({ mv: q.prevPos - q.pos }, q));
    const losses = ranked.filter((q) => q.mv < -0.3).sort((a, b) => a.mv - b.mv).slice(0, 3), gains = ranked.filter((q) => q.mv > 0.3).sort((a, b) => b.mv - a.mv).slice(0, 3);
    const lst = (arr, cls, empty) => arr.length ? arr.map((q) => '<div class="item"><span class="grow sm">' + esc(q.q) + '</span><span class="delta ' + cls + '">' + nf1.format(q.prevPos) + ' → ' + nf1.format(q.pos) + '</span></div>').join('') : '<div class="item muted sm">' + empty + '</div>';
    body += '<section class="grid g-2" style="align-items:start"><div class="card flush">' + cardHead('Biggest position losses', '<span class="xs muted">non-brand, 500+ impressions</span>') + lst(losses, 'worse', 'No query lost more than a third of a position.') + '</div><div class="card flush">' + cardHead('Biggest position gains') + lst(gains, 'better', 'No notable gains this period.') + '</div></section>';
    body += '<section class="card flush">' + cardHead('Top queries', aiBtn('queries') + brandSeg) + qTable(qs.slice(0, 8)) + '<p class="xs muted" style="padding:12px 16px">About 18% of clicks have no query attached because Google withholds rare queries for privacy, so query totals will not match Clicks above.</p></section>';
  } else if (tab === 'queries') {
    body += '<section class="card flush">' + cardHead('All queries', brandSeg) + qTable(qs) + '</section>';
  } else if (tab === 'pages') {
    const clicks = metricVal(c, 'clicks');
    body += '<section class="card flush">' + cardHead('Pages') + '<div class="scroll-x"><table class="t"><thead><tr><th>Page</th><th class="n">Clicks ▾</th><th class="n">Impressions</th><th class="n">Position</th></tr></thead><tbody>' + c.pages.map((p) => { const k = rnd(c.id + p[0] + 'gsc'); const cl = clicks.cur * p[1] * 0.9; return '<tr><td>' + urlLink(c, c.sites[0].d, p[0]) + '</td><td class="n">' + nf0.format(cl) + '</td><td class="n">' + nf0.format(cl * (30 + k * 40)) + '</td><td class="n">' + nf1.format(3 + k * 12) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  } else {
    body += '<section class="grid g-2" style="align-items:start"><div class="card stack"><h2 class="card-title">Countries</h2><div class="bars">' + [['United Kingdom', 88], ['Ireland', 5], ['Germany', 4], ['Other', 3]].map((r) => '<span>' + r[0] + '</span><div class="track"><div class="bar" style="width:' + r[1] / 88 * 100 + '%"></div></div><span class="num" style="text-align:right">' + r[1] + '%</span>').join('') + '</div></div><div class="card stack"><h2 class="card-title">Devices</h2><div class="bars">' + [['Mobile', 71], ['Desktop', 26], ['Tablet', 3]].map((r) => '<span>' + r[0] + '</span><div class="track"><div class="bar" style="width:' + r[1] / 71 * 100 + '%"></div></div><span class="num" style="text-align:right">' + r[1] + '%</span>').join('') + '</div></div></section>';
  }
  return '<div class="page-head"><h1 class="page-title">Organic search</h1>' + tier('google') + '</div><nav class="tabs" aria-label="Organic search views">' + tabs.map((t) => '<a href="' + cHref(c, 'organic', t[0]) + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + '</a>').join('') + '<a href="' + cHref(c, 'technical') + '">Indexing ↗</a></nav>' + body;
}

/* ---------- paid ---------- */
function pagePaid(c) {
  const sp = metricVal(c, 'spend'); const plats = ['google', 'meta', 'linkedin'].filter((p) => c.ads && c.ads[p]);
  const tabs = [['cross', 'Cross-platform']].concat(plats.map((p) => [p, platName(p)]));
  const tab = tabs.find((t) => t[0] === S.paidTab) ? S.paidTab : 'cross';
  const ecom = c.type === 'Ecommerce';
  let body = '';
  if (tab === 'cross') {
    body += paidLeadsCard(c);
    const rows = plats.map((p) => { const s = sp.cur * c.ads[p].spend; const k = rnd(c.id + p + S.range); const clicks = s / (0.6 + k * 0.3); const imp = clicks / (0.012 + k * 0.006); return { p, s, prev: s / (1 + (changeOf(sp).val + (k - 0.5) * 8) / 100), clicks, imp }; });
    const tot = rows.reduce((a, r) => ({ s: a.s + r.s, prev: a.prev + r.prev, clicks: a.clicks + r.clicks, imp: a.imp + r.imp }), { s: 0, prev: 0, clicks: 0, imp: 0 });
    body += '<section class="card flush">' + cardHead('Delivery', '<span class="xs muted">metrics both platforms count the same way, so totals are safe</span>') + '<div class="scroll-x"><table class="t"><thead><tr><th>Platform</th><th class="n">Spend</th><th class="n">Change</th><th class="n">Impressions</th><th class="n">Clicks</th><th class="n">CTR</th><th class="n">CPC</th></tr></thead><tbody>' + rows.map((r) => '<tr><td>' + (platName(r.p)) + '</td><td class="n">' + money(r.s) + '</td><td class="n">' + pctDelta(r.s, r.prev, 'none') + '</td><td class="n">' + compact(r.imp) + '</td><td class="n">' + nf0.format(r.clicks) + '</td><td class="n">' + nf2.format(r.clicks / r.imp * 100) + '%</td><td class="n">' + money(r.s / r.clicks, 'GBP', { pence: true }) + '</td></tr>').join('') + (rows.length > 1 ? '<tr class="total"><td>Total</td><td class="n">' + money(tot.s) + '</td><td class="n">' + pctDelta(tot.s, tot.prev, 'none') + '</td><td class="n">' + compact(tot.imp) + '</td><td class="n">' + nf0.format(tot.clicks) + '</td><td class="n">' + nf2.format(tot.clicks / tot.imp * 100) + '%</td><td class="n">' + money(tot.s / tot.clicks, 'GBP', { pence: true }) + '</td></tr>' : '') + '</tbody></table></div></section>';
    if (ecom && c.m.revenue) {
      const claims = plats.map((p) => ({ name: (platName(p)) + ' claims', sub: p === 'google' ? 'data-driven, 30-day click' : '7-day click, 1-day view', v: sp.cur * c.ads[p].spend * c.ads[p].roas, t: 'platform' }));
      const ch = channelRows(c); const gaPaid = ch.filter((r) => r.name.indexOf('Paid') === 0).reduce((a, r) => a + (r.rev || 0), 0);
      const rev = metricVal(c, 'revenue');
      const items = claims.concat([{ name: 'GA4 paid channels', sub: 'paid search plus paid social', v: gaPaid, t: 'measured' }, { name: 'Store revenue, all sources', sub: '', v: rev.cur, t: 'actual' }]);
      const mx = Math.max.apply(null, items.map((i) => i.v));
      const claimed = claims.reduce((a, x) => a + x.v, 0);
      body += '<section class="card stack"><div class="row between"><h2 class="card-title">What did ads earn? Three honest answers</h2><div class="row"><span class="xs muted">side by side, never added together</span>' + aiBtn('paid') + '</div></div><div class="bars" style="grid-template-columns:minmax(150px,220px) 1fr 96px">' + items.map((i) => '<div><div style="font-weight:500">' + i.name + '</div><div class="row" style="gap:6px">' + tier(i.t) + (i.sub ? '<span class="xs muted">' + i.sub + '</span>' : '') + '</div></div><div class="track"><div style="height:18px;border-radius:3px;width:' + (i.v / mx * 100).toFixed(0) + '%;background:var(' + (i.t === 'platform' ? '--chart-1' : i.t === 'measured' ? '--chart-6' : '--ink') + ')"></div></div><span class="num" style="text-align:right">' + money(i.v) + '</span>').join('') + '</div>' +
        '<div class="row" style="gap:28px;border-top:1px solid var(--border);padding-top:12px;align-items:flex-start"><div><div class="kpi-label">MER</div><div class="kpi-md">' + nf2.format(rev.cur / sp.cur) + '</div><div class="xs muted">store revenue ÷ total spend</div></div><p class="sm muted grow" style="max-width:60ch">' + (claims.length > 1 ? 'Platforms claim ' + money(claimed) + ' between them against ' + money(gaPaid) + ' that GA4 credits to paid channels. Some orders are claimed by both, and only Meta counts view-through conversions.' : 'Platform-reported value uses the platform\'s own attribution, so it will not match GA4 or store sales.') + '</p></div></section>';
    }
    const wk = weeks(4); const parts = wk.map((w, i) => ({ label: w.label, parts: plats.map((p) => sp.cur * c.ads[p].spend / 4 * (0.92 + i * 0.05)) }));
    body += '<section class="card stack"><div class="row between"><h2 class="card-title">Weekly spend</h2>' + legend(plats.map((p, i) => ({ name: platName(p), color: ['--chart-1', '--chart-2', '--chart-3'][i], box: 1 }))) + '</div>' + weeklyBars(parts, ['--chart-1', '--chart-2', '--chart-3'], (v) => money(v, 'GBP', { compact: true }), 'Weekly spend by platform') + '</section>';
  } else {
    const rows = campaigns(c, tab);
    const tot = rows.reduce((a, r) => ({ s: a.s + r.spend, cl: a.cl + r.clicks, cv: a.cv + r.conv, v: a.v + (r.value || 0) }), { s: 0, cl: 0, cv: 0, v: 0 });
    const hasRoas = rows.some((r) => r.roas);
    const isLead = rows.some((r) => r.leadCamp);
    if (c.id === 'kestrel' && tab === 'meta' && issueState(ISSUES[2]) !== 'resolved') body += '<div class="banner warning"><strong>DE launch results are understated.</strong> Purchase events from kestreloutdoor.de fell 64% from 16 Oct while store orders held steady. Judge that campaign on store orders until tracking is fixed.<a class="act" href="#" ' + act('issue', 'i3') + '>Open issue</a></div>';
    body += '<section class="card flush">' + cardHead('Campaigns', aiBtn('paid') + (isLead ? tier('actual') + '<span class="xs muted">leads are form submissions, the same records as Leads</span><a class="btn small" href="' + cHref(c, 'leads') + '">Open Leads</a>' : tier('platform') + '<span class="xs muted">' + platAttr(tab).toLowerCase() + '</span>')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Campaign</th><th>Type</th><th class="n" aria-sort="descending">Spend ▾</th><th class="n">Clicks</th><th class="n">' + (hasRoas ? 'Purchases' : isLead ? 'Form leads' : 'Conversions') + '</th>' + (hasRoas ? '<th class="n">Conv. value</th><th class="n">ROAS</th>' : '<th class="n">CPA</th>') + (tab === 'meta' ? '<th class="n">Frequency</th>' : '') + (isLead ? '<th></th>' : '') + '</tr></thead><tbody>' +
      rows.sort((a, b) => b.spend - a.spend).map((r) => '<tr><td>' + esc(r.name) + (r.flag ? ' ' + badge('warning', r.flag) : '') + '</td><td class="muted">' + r.type + '</td><td class="n">' + money(r.spend) + '</td><td class="n">' + nf0.format(r.clicks) + '</td><td class="n">' + nf0.format(r.conv) + '</td>' + (hasRoas ? '<td class="n">' + money(r.value || 0) + '</td><td class="n">' + (r.roas ? nf2.format(r.roas) : 'n/a') + '</td>' : '<td class="n">' + (r.cpa ? money(r.cpa, 'GBP', { pence: true }) : 'n/a') + '</td>') + (tab === 'meta' ? '<td class="n"' + (r.freq > 4 ? ' style="color:var(--bad)"' : '') + '>' + (r.freq ? nf1.format(r.freq) : 'n/a') + '</td>' : '') + (isLead ? '<td><button class="btn small" ' + act('leadFilter', 'campaign|' + r.leadCamp) + '>View ' + nf0.format(r.conv) + ' leads</button></td>' : '') + '</tr>').join('') +
      '<tr class="total"><td>Total</td><td></td><td class="n">' + money(tot.s) + '</td><td class="n">' + nf0.format(tot.cl) + '</td><td class="n">' + nf0.format(tot.cv) + '</td>' + (hasRoas ? '<td class="n">' + money(tot.v) + '</td><td class="n">' + nf2.format(tot.v / tot.s) + '</td>' : '<td class="n">' + money(tot.s / Math.max(1, tot.cv), 'GBP', { pence: true }) + '</td>') + (tab === 'meta' ? '<td></td>' : '') + (isLead ? '<td></td>' : '') + '</tr></tbody></table></div>' + (currencies(c).length > 1 ? '<p class="xs muted" style="padding:12px 16px">Campaigns billed in EUR are ' + FX_NOTE + '.</p>' : '') + '</section>';
  }

}

/* ---------- ecommerce ---------- */

  const one = sel !== 'all' ? stores.find((r) => r.site.d === sel) : null;
  const cur = one ? one.site.cur : 'GBP';
  const tabs = [['sales', 'Sales'], ['products', 'Products'], ['stores', 'Stores']];
  let body = '';
  if (tab === 'sales') {
    const rev = metricVal(c, 'revenue', { scoped: false }), ord = metricVal(c, 'orders', { scoped: false }), aov = metricVal(c, 'aov', { scoped: false });
    const k = (label, v, d) => '<div class="card kpi"><span class="kpi-label">' + label + '</span><span class="kpi-value num">' + v + '</span><span class="kpi-compare">' + d + '</span></div>';
    const r = one ? one.gbp : rev.cur, o = one ? one.orders : ord.cur, pr = one ? one.gbp / (1 + one.d / 100) : rev.prev;

    body += (c.sites.length > 1 ? '<div class="scroll-x">' + seg('ecomStore', [['all', 'All stores (GBP)']].concat(c.sites.map((s) => [s.d, s.d + ' · ' + s.cur])), sel, 'Store') + '</div>' : '') +
      (S.loading ? '<section class="grid g-kpi">' + skelKpi() + skelKpi() + skelKpi() + skelKpi() + '</section>' : '<section class="grid g-kpi">' + k('Revenue', money(toCur(r, cur), cur), pctDelta(r, pr, 'up')) + k('Orders', nf0.format(o), pctDelta(o, one ? o / (1 + (one.d - 3) / 100) : ord.prev, 'up')) + k('Average order value', money(toCur(r / o, cur), cur, { pence: true }), one ? '' : deltaHtml(aov)) + k('Refunds', money(toCur(refunds, cur), cur), '<span>' + nf1.format(refunds / r * 100) + '% of revenue</span>') + '</section>') +
      '<p class="xs muted">' + (one ? esc(one.site.d) + ' in ' + cur + '.' : currencies(c).length > 1 ? 'All stores in GBP, ' + FX_NOTE + '. Pick a store to see its own currency.' : SVC[c.store].name + ' · synced 08:05') + '</p>';
    const wk = weeks(4); const shares = [0.23, 0.24, 0.26, 0.27]; const list = one ? [one] : stores; const colors = ['--chart-1', '--chart-2', '--chart-3', '--chart-4'];
    body += '<section class="card stack"><div class="row between"><h2 class="card-title">Weekly revenue' + (one ? '' : ' by store') + '</h2>' + legend(list.map((x, i) => ({ name: x.site.d, color: colors[i % 4], box: 1 }))) + '</div>' + weeklyBars(wk.map((w, i) => ({ label: w.label, parts: list.map((x) => toCur(x.gbp * shares[i], cur)) })), list.map((x, i) => colors[i % 4]), (v) => money(v, cur, { compact: true }), 'Weekly revenue') + '</section>';
  }
  if (tab === 'sales' || tab === 'products') {
    const prods = productRows(c).filter((p) => sel === 'all' || p.site === sel).sort((a, b) => b.gbp - a.gbp);
    body += '<section class="card flush">' + cardHead(tab === 'sales' ? 'Top products' : 'Products', aiBtn('products') + (tab === 'sales' ? link(cHref(c, 'ecommerce', 'products'), 'All products') : '')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Product</th><th>Store</th><th class="n">Units</th><th class="n" aria-sort="descending">Revenue ▾</th><th class="n">Change</th><th class="n">Refund rate</th></tr></thead><tbody>' + (prods.length ? prods.map((p) => { const cc = sel === 'all' ? 'GBP' : p.cur; return '<tr><td>' + esc(p.name) + '</td><td class="muted">' + esc(p.site) + '</td><td class="n">' + nf0.format(p.units) + '</td><td class="n">' + money(toCur(p.gbp, cc), cc) + '</td><td class="n">' + (p.d == null ? '<span class="delta neutral">New</span>' : '<span class="delta ' + judge('up', p.d) + '">' + (p.d >= 0 ? '▲ ' : '▼ ') + nf1.format(Math.abs(p.d)) + '%</span>') + '</td><td class="n"' + (p.refund > 5 ? ' style="color:var(--bad)"' : '') + '>' + nf1.format(p.refund) + '%</td></tr>'; }).join('') : '<tr><td colspan="6" class="muted">No products sold in this store in the period.</td></tr>') + '</tbody></table></div></section>';
  }
  if (tab === 'sales' || tab === 'stores') {
    body += '<section class="card flush">' + cardHead('Tracking check: store against GA4', '<span class="xs muted">a gap over 10% raises an issue</span>' + aiBtn('stores')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Store</th><th class="n">Store ' + tier('actual') + '</th><th class="n">GA4 ' + tier('measured') + '</th><th class="n">Gap</th><th>Note</th></tr></thead><tbody>' + stores.map((r) => '<tr><td>' + esc(r.site.d) + '</td><td class="n">' + money(toCur(r.gbp, r.site.cur), r.site.cur) + '</td><td class="n">' + (r.ga ? money(toCur(r.ga, r.site.cur), r.site.cur) : 'n/a') + '</td><td class="n"' + (r.gap < -10 ? ' style="color:var(--bad)"' : '') + '>' + nf1.format(r.gap) + '%</td><td>' + (r.gap < -10 ? badge('warning', 'Check consent banner') : '<span class="muted xs">Normal range</span>') + '</td></tr>').join('') + '</tbody></table></div></section>';

/* ---------- technical ---------- */
function pageTechnical(c, tab) {

  let body = '';
  if (tab === 'indexing') {
    const ix = indexData(c); const f = S.techReason;
    const urls = urlRows(c).filter((u) => f === 'all' || (f === 'notindexed' ? u[0] !== 'indexed' : u[0] === f));
    const mx = Math.max.apply(null, ix.reasons.map((r) => r.n)) || 1;
    body += '<section class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">' + [['google', "Google's own verdict for a URL, from the URL Inspection API. Dated per URL."], ['crawler', 'Found by our crawler: broken links, redirects, canonical tags. Not Google\'s view. Phase 2.'], ['derived', 'Patterns and totals we calculate from the above. Treat as a lead, not a fact.']].map((t) => '<div class="stack" style="gap:6px"><span>' + tier(t[0]) + '</span><span class="xs muted">' + t[1] + '</span></div>').join('') + '</section>' +
      '<section class="grid g-kpi"><div class="card"><div class="kpi-label">Known URLs</div><div class="kpi-md">' + nf0.format(ix.known) + '</div><div class="xs muted">from sitemaps, Search Console and GA4</div></div><div class="card"><div class="kpi-label">Inspected, last 14 days</div><div class="kpi-md">' + nf0.format(ix.known) + '</div><div class="xs muted">100% coverage</div></div><div class="card"><div class="row between"><span class="kpi-label">Indexed</span>' + tier('google') + '</div><div class="kpi-md">' + nf0.format(ix.known - ix.notIdx) + '</div><div class="xs muted">' + nf0.format((ix.known - ix.notIdx) / ix.known * 100) + '% of inspected</div></div><div class="card"><div class="row between"><span class="kpi-label">Not indexed</span>' + tier('google') + '</div><div class="kpi-md">' + nf0.format(ix.notIdx) + '</div><div class="xs muted">' + (c.id === 'kestrel' ? '<span class="delta worse">▲ 38</span> since 3 Oct' : 'no change since 3 Oct') + '</div></div></section>' +
      (c.id === 'kestrel' ? '<section class="card row" style="flex-wrap:nowrap;align-items:flex-start;border-color:var(--bad)">' + tier('derived') + '<p class="sm"><strong>Pattern: 38 new fellrunner.co.uk product URLs are "Crawled - currently not indexed".</strong> All were added to the sitemap on 9 Oct and 31 are colour variants of 6 products. Likely cause: thin variant pages competing with each other. <a href="#" ' + act('issue', 'i4') + '>Open issue</a></p></section>' : '') +
      '<section class="grid g-2" style="align-items:start"><div class="card stack"><div class="row between"><h2 class="card-title">Why pages are not indexed</h2><span class="xs muted">click to filter</span></div>' + ix.reasons.map((r) => '<button class="opt' + (f === r.id ? ' on' : '') + '" ' + act('techReason', f === r.id ? 'notindexed' : r.id) + ' aria-pressed="' + (f === r.id) + '" style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.4fr) 48px 44px;min-height:44px"><span>' + r.label + '</span><span class="track"><span class="bar" style="display:block;width:' + (r.n / mx * 100).toFixed(0) + '%"></span></span><span class="num" style="text-align:right">' + nf0.format(r.n) + '</span><span class="num xs" style="text-align:right;color:var(--' + (r.d.indexOf('▲') === 0 ? 'bad' : 'ink-muted') + ')">' + r.d + '</span></button>').join('') + '<button class="opt' + (f === 'all' ? ' on' : '') + '" ' + act('techReason', f === 'all' ? 'notindexed' : 'all') + '>Show all inspected URLs, including indexed</button></div>' +
      '<div class="card stack"><div class="row between"><h2 class="card-title">Inspection budget today</h2><span class="xs muted">Google allows 2,000 per property a day</span></div><div class="bars">' + c.sites.map((s) => { const used = Math.round(150 + rnd(s.d + 'insp') * 1700); return '<span class="xs">' + esc(s.d) + '</span><div class="track"><div class="bar" style="width:' + (used / 20).toFixed(0) + '%"></div></div><span class="num" style="text-align:right">' + nf0.format(used) + '</span>'; }).join('') + '</div><p class="xs muted">Priority: new sitemap URLs, pages with traffic or impressions, recently changed pages, then the rest on rotation.</p></div></section>' +
      '<section class="card flush">' + cardHead('URLs <span class="muted" style="font-weight:400">· ' + (f === 'all' ? 'all inspected' : f === 'notindexed' ? 'not indexed' : esc((ix.reasons.find((r) => r.id === f) || {}).label || '')) + '</span>', aiBtn('indexing') + '<button class="btn small" ' + act('toast', 'Queued for re-inspection. Results arrive within the day.') + '>Re-inspect</button>') + '<div class="scroll-x"><table class="t"><thead><tr><th>URL</th><th>Google status</th><th>Last crawled</th><th>Canonical, declared / Google</th><th>Inspected</th><th class="n">Sessions</th></tr></thead><tbody>' + (urls.length ? urls.map((u) => '<tr><td>' + urlLink(c, u[1], u[2]) + '<div class="xs muted">' + esc(u[1]) + '</div></td><td>' + badge(u[4], u[3]) + '</td><td class="num xs">' + u[5] + '</td><td class="xs wrap" style="min-width:180px">' + esc(u[6]) + '</td><td class="num xs">' + u[7] + '</td><td class="n">' + nf0.format(u[8]) + '</td></tr>').join('') : '<tr><td colspan="6" class="muted">No sample URLs in this group. <button class="btn small" ' + act('techReason', 'notindexed') + '>Show not indexed</button></td></tr>') + '</tbody></table></div></section>';
  } else if (tab === 'cwv') {
    const rows = cwvRows(c);
    const cell = (v, good, poor, fmt) => '<td class="n"' + (v > poor ? ' style="color:var(--critical)"' : v > good ? ' style="color:var(--bad)"' : '') + '>' + fmt(v) + (v > good ? ' ' + badge(v > poor ? 'critical' : 'warning', v > poor ? 'Poor' : 'Needs work') : '') + '</td>';
    body += '<section class="card flush">' + cardHead('Core Web Vitals, mobile', tier('google') + '<span class="xs muted">field data, 75th percentile, 28 days</span>') + '<div class="scroll-x"><table class="t"><thead><tr><th>Site</th><th class="n">LCP</th><th class="n">INP</th><th class="n">CLS</th><th>Overall</th></tr></thead><tbody>' + rows.map((r) => { const pass = r.lcp <= 2.5 && r.inp <= 200 && r.cls <= 0.1; return '<tr><td>' + esc(r.site.d) + '</td>' + cell(r.lcp, 2.5, 4, (v) => nf1.format(v) + 's') + cell(r.inp, 200, 500, (v) => nf0.format(v) + ' ms') + cell(r.cls, 0.1, 0.25, (v) => nf2.format(v)) + '<td>' + badge(pass ? 'healthy' : 'warning', pass ? 'Passes' : 'Fails') + '</td></tr>'; }).join('') + '</tbody></table></div><p class="xs muted" style="padding:12px 16px">Thresholds: LCP 2.5s, INP 200 ms, CLS 0.1. Pages without enough Chrome traffic fall back to the site-level figure.</p></section>';
  } else if (tab === 'sitemaps') {
    body += '<section class="card flush">' + cardHead('Sitemaps', tier('google')) + '<div class="scroll-x"><table class="t"><thead><tr><th>Sitemap</th><th class="n">URLs submitted</th><th>Last read by Google</th><th>Status</th></tr></thead><tbody>' + c.sites.map((s) => '<tr><td class="num xs">https://' + esc(s.d) + '/sitemap.xml</td><td class="n">' + nf0.format(Math.round(indexData(c).known / c.sites.length)) + '</td><td class="num xs">18 Oct</td><td>' + badge('healthy', 'Success') + '</td></tr>').join('') + '</tbody></table></div></section>';
  } else {
    body += emptyState('Crawl checks arrive in phase 2', 'Our own crawler will check broken links, redirect chains and canonical tags on every site each week. Its findings will be labelled Crawler-detected so they are never confused with Google\'s view.', '<button class="btn" ' + act('toast', 'We will tell you when it is ready.') + '>Notify me</button>');
  }
  return '<div class="page-head"><h1 class="page-title">Technical SEO</h1><span class="xs muted">Inspections up to 17 Oct</span></div><nav class="tabs" aria-label="Technical SEO views">' + tabs.map((t) => '<a href="' + cHref(c, 'technical', t[0]) + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + (t[0] === 'crawl' ? ' ' + badge('', 'Phase 2') : '') + '</a>').join('') + '</nav>' + body;
}

    '<div class="card stack"><div class="row between"><h2 class="card-title">Cloudflare</h2>' + (svcStatus(c, 'cloudflare') ? fresh('ok', 'Synced 08:10') : badge('', 'Not connected')) + '</div>' + (svcStatus(c, 'cloudflare') ? '<div class="mini"><div><div class="mini-label">Requests</div><div class="kpi-md">' + compact(metricVal(c, 'sessions').cur * 34) + '</div></div><div><div class="mini-label">Served from cache</div><div class="kpi-md">71%</div></div><div><div class="mini-label">Threats blocked</div><div class="kpi-md">' + compact(38200 * RANGES[S.range].days / 28) + '</div></div><div><div class="mini-label">Top threat source</div><div class="kpi-md" style="font-size:16px">Bot traffic</div></div></div>' : '<p class="sm muted">Connect Cloudflare to see traffic, cache rate and blocked threats for these sites.</p>') + '<p class="xs muted">Server load, disk and memory from cPanel and WHM arrive in phase 2.</p></div></section>';

/* ---------- client settings ---------- */
function pageClientSettings(c) {

/* ---------- routing questions ---------- */
function aiRoute(ctx, q, target) {
  const t = (q || '').toLowerCase();
  if (target) {
    const [kind, arg] = target.split(':');
    if (ctx.mode === 'agency' && kind !== 'movers') ctx = Object.assign({}, ctx, { mode: 'client', client: BY_ID[S.clientId] || ctx.client, clients: [BY_ID[S.clientId]], scopeLabel: (BY_ID[S.clientId] || {}).name });
    switch (kind) {
      case 'chart': return ansTrend(ctx, arg);
      case 'channels': return ansChannels(ctx);
      case 'queries': return ansOrganic(ctx);
      case 'paid': return ansPaid(ctx);
      case 'stores': return ansStores(ctx);
      case 'products': return ansProducts(ctx);
      case 'indexing': return ansTechnical(ctx);
      case 'uptime': return ansUptime(ctx);
      case 'leads': return ansLeads(ctx);
      case 'kpis': return ansSummary(ctx);
      case 'movers': return agAttention(Object.assign({}, ctx, { mode: 'agency' }));
      case 'insight': { const ins = insightsFor(ctx.client).find((i) => i.id === arg); return ins ? ansInsight(ctx, ins) : ansSummary(ctx); }
    }
  }
  if (ctx.mode === 'client') {
    const other = CLIENTS.find((c) => c.id !== ctx.client.id && t.indexOf(c.name.toLowerCase().split(' ')[0]) >= 0);
    if (other) return ansRestricted(ctx, other);
    if (/forecast|predict|next month|will .* be/.test(t)) return ansForecast(ctx);
    if (/competitor|weather|social follower|crm|email open/.test(t)) return ansNoData(ctx, /competitor/.test(t) ? 'competitor data' : 'data on that');
    if (/connected|what data|sources/.test(t)) return ansSources(ctx);
    if (/decid|decision|agreed|previous|history|we know|knowledge|recorded|notes|finding|meeting|team said/.test(t)) return ansKnowledge(ctx, t);
    if (/tracking|track|data quality|understated/.test(t)) { const r = agTracking(Object.assign({}, ctx, { clients: [ctx.client] })); r.title = 'Tracking and data checks for ' + ctx.client.name; return r; }
    if (/conversion|convert/.test(t)) return ansConversion(ctx);
    if (hasLeadForms(ctx.client) && /lead form|form lead|cost per lead|cpl|instant form|linkedin|which form|cheapest lead/.test(t)) return ansLeads(ctx);
    if (/lead|enquir|booking|appointment|form/.test(t)) return ansLeadRate(ctx);
    if (/channel|traffic|session|drove/.test(t)) return ansChannels(ctx);
    if (/organic|quer|seo|search console|ranking|position|clicks/.test(t)) return ansOrganic(ctx);
    if (/paid|roas|meta|google ads|spend|mer|campaign|frequency|efficien|cpa|cost per/.test(t)) return ansPaid(ctx);
    if (/store|product|sales|order|refund|revenue by/.test(t)) return /product|refund/.test(t) ? ansProducts(ctx) : ansStores(ctx);
    if (/index|technical|vitals|cwv|lcp|crawl/.test(t)) return ansTechnical(ctx);
    if (/uptime|down|incident|response time/.test(t)) return ansUptime(ctx);
    if (/last year|year on year|yoy/.test(t)) { const saved = S.compare; S.compare = 'yoy'; try { const r = ansSummary(Object.assign({}, ctx, { compare: 'yoy', compareLabel: COMPARES.yoy })); r.title = 'Against the same period last year'; return r; } finally { S.compare = saved; } }
    if (/summar|happen|overview|period|report|executive/.test(t)) return ansSummary(ctx);
    return ansFallback(ctx);
  }
  if (/attention|priorit|this week|worry|problem client/.test(t)) return agAttention(ctx);
  if (/track|data problem|sync|gap/.test(t)) return agTracking(ctx);
  if (/paid|roas|mer|efficien|spend/.test(t)) return agPaid(ctx);
  if (/grow|fastest|best|movers|rising|falling/.test(t)) return agGrowth(ctx);
  if (/forecast|predict/.test(t)) return ansForecast(ctx);
  if (/summar|portfolio|overview/.test(t)) return agAttention(ctx);
  return ansFallback(ctx);
}

const SimulatedProvider = {
  name: 'Simulated (prototype)',
  run(ctx, q, target) {
    const sim = S.aiCfg.sim;
    const spent = 142.6 + AI_STATE.session.cost;

    if (sim === 'error') return { status: 'error' };
    const r = aiRoute(ctx, q, target);
    if (ctx.mode === 'client' && !(r.blocks || []).some((b) => b.type === 'knowledge')) { const tk = { chart: 'revenue sale promotion conversion', channels: 'channels conversion', queries: 'organic seo ranking', paid: 'paid meta mer tracking', stores: 'tracking consent', indexing: 'indexing technical', uptime: 'uptime deploy', products: 'products', kpis: 'decision reporting' }; attachKnowledge(r, ctx.client, q || tk[(target || '').split(':')[0]] || ''); }
    r.usage = { tokensIn: 2400 + Math.round(rnd(q + target) * 4000), tokensOut: 380 + Math.round(rnd(target + q) * 600) };
    r.usage.costGBP = (r.usage.tokensIn * 0.0000016 + r.usage.tokensOut * 0.0000064);

};

/* ---------- running a request ---------- */
function aiSteps(ctx, target) {
  const n = ctx.mode === 'client' ? Object.keys(ctx.client.svc).length : ctx.clients.length;
  return ['Reading context: ' + (ctx.mode === 'client' ? ctx.client.name : ctx.scopeLabel) + ', ' + ctx.range.dates, ctx.mode === 'client' ? 'Fetching ' + n + ' connected sources' : 'Fetching issues and KPIs for ' + n + ' clients', 'Checking data freshness and open tracking issues', 'Comparing with the ' + ctx.compareLabel, 'Separating confirmed findings from hypotheses'];
}
function aiAsk(q, target, label) {
  if (AI.busy) return;
  AI.open = true;
  const ctx = aiContext();
  const resp = AIService.provider.run(ctx, q, target);
  AI.thread.push({ role: 'user', text: label || q, q: q, target: target });
  const m = { role: 'ai', pending: true, steps: aiSteps(ctx, target), step: 0, resp: Object.assign({ status: 'ok', blocks: [], sources: [], followUps: [] }, resp) };
  AI.thread.push(m); AI.busy = true; AI.scrollBottom = true; AI.draft = '';
  render();
  const delay = S.aiCfg.sim === 'slow' ? 1100 : 380;
  clearInterval(AI.timer);
  AI.timer = setInterval(() => {
    m.step++;
    if (m.step >= m.steps.length) {
      clearInterval(AI.timer); m.pending = false; AI.busy = false;
      if (m.resp.usage) { AI.session.requests++; AI.session.tokens += m.resp.usage.tokensIn + m.resp.usage.tokensOut; AI.session.cost += m.resp.usage.costGBP; AI.audit.unshift({ at: '20 Oct ' + (8 + Math.floor(AI.session.requests / 6)) + ':' + String(15 + AI.session.requests % 40).padStart(2, '0'), who: PEOPLE[ME], feature: target ? 'Analyse with AI' : (ctx.mode === 'client' ? 'Ask AI, client' : 'Ask AI, agency-wide'), client: ctx.mode === 'client' ? ctx.client.name : ctx.scopeLabel, tokens: m.resp.usage.tokensIn + m.resp.usage.tokensOut }); }
    }
    AI.scrollBottom = true; render();
  }, delay);
}

function ansLeads(ctx) {

  const best = rows.filter((x) => x.cpl).sort((a, b) => a.cpl - b.cpl)[0];
  const items = [F('confirmed', nf0.format(st.cur.length) + ' leads this period' + (st.prev ? ', ' + changeWords({ text: (st.cur.length >= st.prev.length ? '▲ ' : '▼ ') + nf1.format(Math.abs((st.cur.length / Math.max(1, st.prev.length) - 1) * 100)) + '%' }) + ' on the ' + esc(ctx.compareLabel) : '') + '. Cost per lead was ' + (st.cpl ? money(st.cpl, 'GBP', { pence: true }) : 'n/a') + '.', [n, sn])];
  if (!st.prev) items.push(F('confirmed', 'There is no comparison because lead forms were connected on ' + fd(cfg.since, true) + '.'));
  if (best) items.push(F('confirmed', esc(best.k.name) + ' has the lowest cost per lead (' + money(best.cpl, 'GBP', { pence: true }) + ').', [n, sn]));
  const plats = DEDUPE(cfg.campaigns.map((k) => k.platform));
  if (plats.length > 1) items.push(F('hypothesis', 'LinkedIn leads cost more but come with job title and company pre-filled, so they may be closer to the client\'s ideal buyer. Lead quality isn\'t in the data yet, so cost per lead alone can\'t say which platform is better value.'));

  r.findings(items);

  r.followUps = ['Which form brings the cheapest leads?', 'Summarise this period'];
  return r;
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (S.pop && !e.target.closest('.pop') && !(el && el.getAttribute('data-act') === 'pop')) { S.pop = null; if (!el) { render(); return; } }
  if (!el) return;
  if (el.disabled) return;
  const name = el.getAttribute('data-act'); const arg = el.getAttribute('data-arg');
  const fn = ACT[name]; if (!fn) return;
  const href = el.tagName === 'A' ? el.getAttribute('href') : null;
  if (!href || href === '#') { if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault(); }
  if (el.type === 'checkbox') { /* let the box toggle, then re-render from state */ }
  const handled = fn(arg);
  if (!handled) render();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]'); if (!el || el.tagName === 'SELECT') return;
  const fn = INPUT[el.getAttribute('data-input')]; if (!fn) return;
  if (!fn(el.value, el.getAttribute('data-arg'))) render();
});
document.addEventListener('change', (e) => {
  const tx = e.target.closest('textarea[data-input="repText"], input[data-input="aiBudget"]');
  if (tx) { if (tx.getAttribute('data-input') === 'repText') { const st = reportDraftState(BY_ID[S.reportClient]); const s = st && st.sections[tx.getAttribute('data-arg')]; if (s && s._dirty) { s.status = 'edited'; s._dirty = false; } } render(); return; }
  const el = e.target.closest('select[data-input]'); if (!el) return;
  const fn = INPUT[el.getAttribute('data-input')]; if (!fn) return;
  if (!fn(el.value, el.getAttribute('data-arg'))) render();
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.palette) S.palette = false; else ACT.palette(); render(); return; }
  if (e.key === 'Escape') { if (S.modal) ACT.modalClose(); else if (S.palette) S.palette = false; else if (S.drawer) S.drawer = null; else if (S.pop) S.pop = null; else if (S.sideOpen) S.sideOpen = false; else if (AI_STATE.open) AI_STATE.open = false; else return; render(); return; }
  if (S.palette && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
    const items = paletteItems(); if (!items.length) return; e.preventDefault();
    if (e.key === 'Enter') { const it = items[Math.min(S.palIdx, items.length - 1)]; S.palette = false; go(it.hash); return; }
    S.palIdx = (S.palIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); return;
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'aiInput') { e.preventDefault(); AI_STATE.draft = e.target.value; ACT.aiSend(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('pointermove', (e) => {
  const wrap = e.target.closest && e.target.closest('.chart-wrap');
  document.querySelectorAll('.tip,.hairline').forEach((n) => { if (!wrap || !wrap.contains(n)) n.remove(); });
  if (!wrap) return;
  const ch = CHARTS[wrap.getAttribute('data-chart')]; if (!ch) return;
  const r = wrap.getBoundingClientRect(); const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
  const n = ch.days.length; const i = Math.round(x / r.width * (n - 1)); const px = n > 1 ? i / (n - 1) * r.width : 0;
  let tip = wrap.querySelector('.tip'), line = wrap.querySelector('.hairline');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; wrap.appendChild(tip); line = document.createElement('div'); line.className = 'hairline'; wrap.appendChild(line); }
  line.style.left = px + 'px';
  tip.style.left = Math.max(70, Math.min(r.width - 70, px)) + 'px';
  tip.innerHTML = '<div class="muted">' + fd(ch.days[i], true) + '</div>' + ch.series.map((s) => '<div class="row between" style="gap:16px;flex-wrap:nowrap"><span>' + esc(s.name) + '</span><strong class="num">' + ch.fmt(s.vals[i]) + '</strong></div>').join('');
});
window.addEventListener('hashchange', () => { parseHash(); render(); const m = document.getElementById('main'); if (m) m.focus && m.setAttribute('tabindex', '-1'); });
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => { if (S.theme === 'system') render(); }); }

parseHash();
render();
})();
